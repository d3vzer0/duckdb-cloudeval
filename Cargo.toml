[package]
name = "duckdb_cloudeval"
version = "0.0.1"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[dependencies]
duckdb-neo = { version = "~0.20000.0", default-features = false, features = ["build-extension"] }
duckdb-loadable-macros = { version = "~1.20000.0", features = ["neo"] }
